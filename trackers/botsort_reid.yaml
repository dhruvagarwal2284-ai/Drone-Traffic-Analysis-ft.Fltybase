# BoT-SORT with ReID (appearance embedding re-association) on top of the
# same track_buffer as botsort_noreid, to see if appearance recovers ids
# through occlusion better than motion/IoU alone. model: auto uses the
# detector's own features -- no extra weight download needed. See EXP3.md.
tracker_type: botsort
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.25
track_buffer: 60
match_thresh: 0.8
fuse_score: True
gmc_method: sparseOptFlow
proximity_thresh: 0.5
appearance_thresh: 0.8
with_reid: True
model: auto
